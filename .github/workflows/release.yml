name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v1.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish registry entry and plugin archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MCP_PUBLISHER_VERSION: v1.8.8
      MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun test
      - name: Check the tag matches server.json
        id: version
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match server.json version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse versions that are already published
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg name "$SERVER_NAME" '$name | @uri')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${VERSION}")"
          if [ "$status" = "200" ]; then
            echo "::error::$SERVER_NAME $VERSION is already in the MCP Registry; bump server.json and every plugin manifest."
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "::error::MCP Registry lookup returned HTTP $status; refusing to publish blind."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG already exists."
            exit 1
          fi
      - name: Build the Codex plugin archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/drophaul-codex-plugin-${VERSION}.zip"
          bun tooling/package-plugin.ts "$archive"
          unzip -t "$archive"
          (cd "$RUNNER_TEMP" && sha256sum "drophaul-codex-plugin-${VERSION}.zip" > "drophaul-codex-plugin-${VERSION}.zip.sha256")
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DropHaul MCP $VERSION" \
            --notes "MCP Registry entry $SERVER_NAME $VERSION and the Codex plugin archive." \
            "$RUNNER_TEMP/drophaul-codex-plugin-${VERSION}.zip" \
            "$RUNNER_TEMP/drophaul-codex-plugin-${VERSION}.zip.sha256"
